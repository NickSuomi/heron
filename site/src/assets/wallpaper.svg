<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Heron OS "Aurora" wallpaper, drawn for this site. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02140f"/>
      <stop offset="0.38" stop-color="#06332b"/>
      <stop offset="0.66" stop-color="#083a45"/>
      <stop offset="1" stop-color="#041a33"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.52" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7cf0a0" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#1fa37a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ribbonGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b8f5a" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#3fdc7c" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#c8f75a" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#43d6b0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1776a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonCore" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f4ffd0" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#e2fff4" stop-opacity="0.8"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20c4c8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2fb6d8" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#2a6fd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1c3b9a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="mid" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="fine" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#bloom)"/>

  <!-- Deep blue swirl, lower right -->
  <path d="M760 1260 C 980 1010 1260 900 1500 930 C 1720 958 1880 1060 2000 1180 L 2000 1300 L 700 1300 Z" fill="url(#ribbonBlue)" filter="url(#soft)" opacity="0.8"/>
  <path d="M-80 1010 C 320 1100 720 1080 1080 900 C 1380 750 1600 520 2000 470" fill="none" stroke="url(#ribbonBlue)" stroke-width="140" filter="url(#soft)" opacity="0.55"/>

  <!-- Main aurora band: a wide glow, a brighter body, and a hot core -->
  <path d="M-120 1080 C 240 980 520 760 820 620 C 1120 480 1420 470 1700 300 C 1820 228 1900 150 2040 40" fill="none" stroke="url(#ribbonGreen)" stroke-width="300" stroke-linecap="round" filter="url(#soft)" opacity="0.75"/>
  <path d="M-60 1040 C 280 960 560 760 850 640 C 1140 520 1420 500 1690 330 C 1800 262 1880 190 2000 90" fill="none" stroke="url(#ribbonGreen)" stroke-width="120" stroke-linecap="round" filter="url(#mid)" opacity="0.9"/>
  <path d="M120 990 C 400 890 620 730 880 630 C 1140 530 1400 510 1640 370" fill="none" stroke="url(#ribbonCore)" stroke-width="26" stroke-linecap="round" filter="url(#mid)"/>

  <!-- A second, thinner sheet folding under the first -->
  <path d="M-100 820 C 300 860 600 820 900 700 C 1200 580 1500 600 1760 520 C 1880 482 1960 440 2040 400" fill="none" stroke="url(#ribbonGreen)" stroke-width="90" stroke-linecap="round" filter="url(#soft)" opacity="0.55"/>
  <path d="M200 850 C 520 850 760 790 980 690 C 1220 582 1480 590 1720 520" fill="none" stroke="url(#ribbonCore)" stroke-width="8" stroke-linecap="round" filter="url(#fine)" opacity="0.7"/>

  <!-- Fine luminous strands riding the bands -->
  <g fill="none" stroke="url(#strand)" stroke-linecap="round" filter="url(#fine)">
    <path d="M60 1010 C 380 910 610 740 870 640 C 1130 540 1400 520 1660 360" stroke-width="2.4" opacity="0.9"/>
    <path d="M40 1050 C 360 950 600 790 860 680 C 1120 572 1380 556 1630 410" stroke-width="1.6" opacity="0.7"/>
    <path d="M100 960 C 420 860 640 700 900 610 C 1160 520 1420 490 1690 320" stroke-width="1.2" opacity="0.6"/>
    <path d="M300 1100 C 620 980 820 820 1060 720 C 1300 620 1560 620 1860 500" stroke-width="1.4" opacity="0.45"/>
    <path d="M-20 900 C 340 900 640 830 940 720 C 1240 612 1520 616 1900 470" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Soft light streaks, top left -->
  <g opacity="0.16" filter="url(#mid)">
    <path d="M180 -40 L 520 700" stroke="#bff7d8" stroke-width="40"/>
    <path d="M360 -40 L 700 640" stroke="#bff7d8" stroke-width="18"/>
  </g>

  <rect width="1920" height="1200" fill="url(#vignette)"/>
</svg>
